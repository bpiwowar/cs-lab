[build-system]
requires = ["hatchling", "hatch-vcs"]
build-backend = "hatchling.build"

[project]
name = "cs-lab"
authors = [{ name = "Benjamin Piwowarski", email = "benjamin@piwowarski.fr" }]
description = "The runtime a teaching notebook needs: a compute-profile ladder, hardware detection, and course resources from a shared local cache (falling back to the Hub)"
readme = "README.md"
license = { text = "MIT" }
keywords = ["teaching", "notebook", "huggingface", "cache", "profile", "hardware"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Education",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Education",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
requires-python = ">=3.10"
dynamic = ["version"]
# No hard dependencies: torch, transformers / datasets / pyterrier /
# datamaestro are imported lazily, only by the functions that need them — a
# student installs this package for a practical that may use none of them.
dependencies = []

[project.optional-dependencies]
hf = ["transformers>=4.30", "datasets>=2.7"]
# In-notebook profile chooser. Optional: without it the profile still comes
# from NOTEBOOK_PROFILE and Profile.set(...).
widgets = ["ipywidgets>=8"]
pyterrier = ["python-terrier>=0.10"]
datamaestro = ["datamaestro>=1.5"]
dev = [
    "pytest>=8",
    "ruff>=0.8",
    "pre-commit>=3.5",
]

[project.scripts]
cs-lab = "cs_lab.cli:main"

[project.urls]
Homepage = "https://github.com/bpiwowar/cs-lab"
Repository = "https://github.com/bpiwowar/cs-lab"

[tool.hatch.version]
source = "vcs"

[tool.hatch.build.hooks.vcs]
version-file = "cs_lab/_version.py"

[tool.hatch.build.targets.wheel]
packages = ["cs_lab"]

[tool.ruff]
line-length = 88
target-version = "py310"

[tool.ruff.format]
quote-style = "double"

[tool.ruff.lint]
select = [
    "E",      # pycodestyle errors
    "F",      # pyflakes
    "W",      # pycodestyle warnings
    "I",      # isort
    "C90",    # mccabe complexity
    "T20",    # flake8-print
]
ignore = [
    "E501",   # line too long (handled by formatter)
]

[tool.ruff.lint.per-file-ignores]
# The CLI reports to stdout on purpose.
"cs_lab/cli.py" = ["T20"]
"tests/*" = ["T20"]

[tool.ruff.lint.mccabe]
max-complexity = 15

[tool.pytest.ini_options]
testpaths = ["tests"]
